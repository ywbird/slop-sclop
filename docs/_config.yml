title: sclop
description: Documentation for sclop, a minimal coding agent for the terminal.
url: "https://ywbird.github.io"
baseurl: "/slop-sclop"
theme: jekyll-theme-minima

minima:
  skin: solarized-light
  nav_pages:
    - index.md

markdown: kramdown
kramdown:
  input: GFM

# Rewrites links to sibling .md files as .html so the existing docs link correctly.
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true

# design notes for contributors, not documentation
exclude:
  - intent

defaults:
  - scope:
      path: ""
    values:
      layout: default
